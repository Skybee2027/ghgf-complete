name: GHGF 42-Robot Autonomous Blogging Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:  # Allow manual trigger

env:
  # Database Configuration
  # Note: DB_HOST should be your external database server, not localhost
  DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
  DB_USER: ${{ secrets.DB_USER || 'root' }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'root' }}
  DB_NAME: ${{ secrets.DB_NAME || 'ghgf_blogging' }}

  # LLM Provider API Keys (at least one required)
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # Note: Model names are now hardcoded in robot scripts (no env variable dependency)
  # Robots use proven defaults:
  #   Groq: mixtral-8x7b-32768
  #   Gemini: gemini-pro
  #   Cohere: command-r-plus
  #   OpenAI: gpt-3.5-turbo

  # WordPress Configuration (for publishing)
  WORDPRESS_URL: ${{ secrets.WORDPRESS_URL || 'https://greathealthgreatfitness.com' }}
  WORDPRESS_USER: ${{ secrets.WORDPRESS_USER || 'api_user' }}
  WORDPRESS_PASSWORD: ${{ secrets.WORDPRESS_PASSWORD || '' }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Verify environment variables are set
      run: |
        echo "Checking required environment variables..."
        if [ -z "$DB_HOST" ]; then echo "ERROR: DB_HOST not set"; exit 1; fi
        if [ -z "$DB_USER" ]; then echo "ERROR: DB_USER not set"; exit 1; fi
        if [ -z "$DB_PASSWORD" ]; then echo "ERROR: DB_PASSWORD not set"; exit 1; fi
        if [ -z "$DB_NAME" ]; then echo "ERROR: DB_NAME not set"; exit 1; fi

        echo "Checking LLM API keys (at least one required for multi-provider fallback)..."
        if [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$COHERE_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
          echo "ERROR: At least one LLM API key must be set (GROQ_API_KEY, GEMINI_API_KEY, COHERE_API_KEY, or OPENAI_API_KEY)"
          exit 1
        fi

        [ -n "$GROQ_API_KEY" ] && echo "✅ GROQ_API_KEY is set"
        [ -n "$GEMINI_API_KEY" ] && echo "✅ GEMINI_API_KEY is set"
        [ -n "$COHERE_API_KEY" ] && echo "✅ COHERE_API_KEY is set"
        [ -n "$OPENAI_API_KEY" ] && echo "✅ OPENAI_API_KEY is set"

        echo ""
        echo "Checking WordPress Publishing Configuration..."
        if [ -z "$WORDPRESS_PASSWORD" ]; then
          echo "⚠️  WARNING: WORDPRESS_PASSWORD is not set - R31 will NOT publish posts to WordPress"
          echo "         To enable publishing, set WORDPRESS_PASSWORD in GitHub Secrets"
        else
          echo "✅ WORDPRESS_PASSWORD is set"
          echo "✅ WORDPRESS_URL is set to: $WORDPRESS_URL"
          echo "✅ WORDPRESS_USER is set to: $WORDPRESS_USER"
        fi
        echo "✅ Database and LLM configuration verified"
    
    - name: Install dependencies
      run: |
        apt-get update && apt-get install -y mysql-client dnsutils
        python -m pip install --upgrade pip
        pip install groq google-generativeai cohere openai mysql-connector-python requests
      continue-on-error: true

    - name: Diagnostic - Test database connectivity
      run: |
        echo "====== DATABASE CONNECTIVITY DIAGNOSTIC ======"
        echo "DB_HOST: $DB_HOST"
        echo "DB_USER: $DB_USER"
        echo "DB_NAME: $DB_NAME"
        echo ""

        # Extract hostname and port
        HOST_ONLY=$(echo "$DB_HOST" | cut -d: -f1)
        PORT=$(echo "$DB_HOST" | cut -d: -f2)
        if [ -z "$PORT" ] || [ "$PORT" = "$HOST_ONLY" ]; then
          PORT=3306
        fi

        echo "Extracted: HOST=$HOST_ONLY PORT=$PORT"
        echo ""

        # Test DNS resolution
        echo "Testing DNS resolution for $HOST_ONLY..."
        nslookup "$HOST_ONLY" || echo "⚠️  DNS lookup failed"
        echo ""

        # Test TCP connection
        echo "Testing TCP connection to $DB_HOST..."
        nc -zv "$HOST_ONLY" "$PORT" 2>&1 || echo "⚠️  TCP connection failed"
        echo ""

        # Test MySQL connection with verbose error
        echo "Testing MySQL connection with credentials..."
        mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" -e "SELECT 1;" 2>&1 || echo "⚠️  MySQL connection failed - see error above"
      continue-on-error: true

    - name: Wait for MySQL and initialize database
      run: |
        echo "Connecting to external database at $DB_HOST..."
        echo "DB_HOST=$DB_HOST"
        echo "DB_USER=$DB_USER"
        echo "DB_NAME=$DB_NAME"

        CONNECTION_SUCCESS=false
        for i in {1..30}; do
          if mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" -e "SELECT 1" 2>&1; then
            echo "✅ Database connection successful!"
            CONNECTION_SUCCESS=true
            break
          fi
          echo "Attempt $i/30 - Connecting to $DB_HOST..."
          sleep 2
        done

        if [ "$CONNECTION_SUCCESS" = false ]; then
          echo "❌ CRITICAL: Could not connect to database at $DB_HOST after 30 attempts"
          echo "Please verify:"
          echo "  1. DB_HOST secret is set correctly"
          echo "  2. DB_USER and DB_PASSWORD are correct"
          echo "  3. Database server is online and accessible"
          echo "  4. Network/firewall allows connection from GitHub Actions"
          exit 1
        fi

        echo "Creating database and loading schema..."
        mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS $DB_NAME;"

        echo "Loading core schemas for R2-R3-R31 pipeline..."
        if [ -f database/R0_Base_Schema.sql ]; then
          if mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < database/R0_Base_Schema.sql 2>&1; then
            echo "✓ Loaded R0_Base_Schema.sql"
          else
            echo "❌ ERROR loading R0_Base_Schema.sql"
            exit 1
          fi
        fi

        if [ -f database/R0_Migration_AddColumns.sql ]; then
          if mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < database/R0_Migration_AddColumns.sql 2>&1; then
            echo "✓ Loaded R0_Migration_AddColumns.sql"
          else
            echo "❌ ERROR loading R0_Migration_AddColumns.sql"
            exit 1
          fi
        fi

        if [ -f database/R0_Migration_R2_RequiredColumns.sql ]; then
          if mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < database/R0_Migration_R2_RequiredColumns.sql 2>&1; then
            echo "✓ Loaded R0_Migration_R2_RequiredColumns.sql"
          else
            echo "❌ ERROR loading R0_Migration_R2_RequiredColumns.sql"
            exit 1
          fi
        fi

        echo "✅ Core schemas loaded successfully."
        echo "Database is now ready with all required tables and data for R2-R3-R31 pipeline."
        echo "Note: R37 and R14b schemas can be loaded later for monetization features."
    
    - name: Run GHGF Pipeline
      run: python run_full_pipeline.py 2>&1 | tee pipeline_output.log
      working-directory: ./

    - name: Verify blog post was created
      run: |
        python3 << 'PYEOF'
        import os
        import mysql.connector

        db_config = {
            'host': os.getenv('DB_HOST'),
            'user': os.getenv('DB_USER'),
            'password': os.getenv('DB_PASSWORD'),
            'database': os.getenv('DB_NAME')
        }

        try:
            conn = mysql.connector.connect(**db_config)
            cursor = conn.cursor(dictionary=True)

            # Check for recent blog posts
            cursor.execute("""
                SELECT id, title, status, wordpress_post_id, created_at
                FROM blog_posts
                ORDER BY created_at DESC
                LIMIT 3
            """)
            posts = cursor.fetchall()

            print("\n" + "="*70)
            print("RECENT BLOG POSTS IN DATABASE")
            print("="*70)

            if posts:
                for post in posts:
                    print(f"ID: {post['id']}")
                    print(f"  Title: {post['title']}")
                    print(f"  Status: {post['status']}")
                    print(f"  WordPress ID: {post['wordpress_post_id']}")
                    print(f"  Created: {post['created_at']}")
                    print()
            else:
                print("❌ NO BLOG POSTS FOUND IN DATABASE!")

            cursor.close()
            conn.close()
        except Exception as e:
            print(f"❌ Error checking database: {str(e)}")
        PYEOF

    - name: Upload error logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-error-logs
        path: |
          error_log_*.txt
          pipeline_output.log
        retention-days: 30
      continue-on-error: true
    
    - name: Workflow status
      if: always()
      run: |
        echo "Workflow completed"
        echo "Check the logs above for any robot failures"
