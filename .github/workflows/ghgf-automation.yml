name: GHGF Automation

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run_robots:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install -r requirements-36robots-updated.txt
      - name: Run R1 API Health Checker
        run: python robots/r1_api_health_checker.py
      - name: Run R14b Digital Product Creator
        run: python robots/r14b_digital_product_creator.py
      - name: Run R37 Content Retrofit Engine
        run: python robots/r37_content_retrofit_engine.py
