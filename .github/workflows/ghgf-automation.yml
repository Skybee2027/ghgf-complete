name: GHGF 42-Robot Autonomous Blogging Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:  # Allow manual trigger

env:
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_NAME: ${{ secrets.DB_NAME }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Verify environment variables are set
      run: |
        echo "Checking required environment variables..."
        if [ -z "$DB_HOST" ]; then echo "ERROR: DB_HOST not set"; exit 1; fi
        if [ -z "$DB_USER" ]; then echo "ERROR: DB_USER not set"; exit 1; fi
        if [ -z "$DB_PASSWORD" ]; then echo "ERROR: DB_PASSWORD not set"; exit 1; fi
        if [ -z "$DB_NAME" ]; then echo "ERROR: DB_NAME not set"; exit 1; fi
        if [ -z "$GROQ_API_KEY" ]; then echo "ERROR: GROQ_API_KEY not set"; exit 1; fi
        echo "✅ All environment variables verified"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install groq mysql-connector-python requests
      continue-on-error: true
    
    - name: Run GHGF Pipeline
      run: python run_full_pipeline.py
      working-directory: ./
    
    - name: Upload error logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-error-logs
        path: error_log_*.txt
        retention-days: 30
    
    - name: Workflow status
      if: always()
      run: |
        echo "Workflow completed"
        echo "Check the logs above for any robot failures"
