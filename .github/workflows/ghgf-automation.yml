name: GHGF 42-Robot Autonomous Blogging Pipeline

on:
  # schedule:
  #   - cron: '0 */6 * * *'  # Run every 6 hours (PAUSED - step-by-step fix in progress)
  workflow_dispatch:  # Allow manual trigger

env:
  # Database Configuration
  # Note: DB_HOST should be your external database server, not localhost
  DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
  DB_USER: ${{ secrets.DB_USER || 'root' }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'root' }}
  DB_NAME: ${{ secrets.DB_NAME || 'ghgf_blogging' }}

  # LLM Provider API Keys (at least one required)
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # LLM Model Names (required for API calls)
  # Configured for your account's available models
  # Can be overridden via GitHub Secrets if needed
  GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
  GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-1.5-flash' }}
  COHERE_MODEL: ${{ secrets.COHERE_MODEL || 'command-a-plus-05-2026' }}
  OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}

  # Image Discovery APIs (for R7: Image Finder)
  UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY || '' }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || '' }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || '' }}

  # AI Image Generation APIs (fallback for R7 if stock photos insufficient)
  REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN || '' }}
  HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY || '' }}

  # WordPress Configuration (for publishing)
  WORDPRESS_URL: ${{ secrets.WORDPRESS_URL || 'https://greathealthgreatfitness.com' }}
  WORDPRESS_USER: ${{ secrets.WORDPRESS_USER || 'api_user' }}
  WORDPRESS_PASSWORD: ${{ secrets.WORDPRESS_PASSWORD || '' }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Verify environment variables are set
      run: |
        echo "======================================================================"
        echo "CHECKING REQUIRED ENVIRONMENT VARIABLES"
        echo "======================================================================"

        # Critical: DB_HOST must be explicitly set (not just the default localhost)
        echo ""
        echo "Checking DATABASE CONFIGURATION (CRITICAL)..."
        if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "localhost" ]; then
          echo "❌ CRITICAL ERROR: DB_HOST is not properly configured!"
          echo ""
          echo "   Current value: '$DB_HOST'"
          echo "   Problem: GitHub Actions runs in the cloud and cannot access localhost"
          echo ""
          echo "   SOLUTION:"
          echo "   1. Find your actual database hostname from cPanel:"
          echo "      - Login: cpanel.greathealthgreatfitness.com"
          echo "      - Go to: Databases → MySQL Databases"
          echo "      - Note the Database Server/Hostname"
          echo ""
          echo "   2. Set GitHub Secret DB_HOST:"
          echo "      - Go to: github.com/Skybee2027/ghgf-complete/settings/secrets/actions"
          echo "      - Create/Update secret: DB_HOST = [your database hostname/IP]"
          echo ""
          echo "   3. Re-run this workflow"
          echo ""
          exit 1
        fi

        if [ -z "$DB_USER" ]; then echo "❌ ERROR: DB_USER not set"; exit 1; fi
        if [ -z "$DB_PASSWORD" ]; then echo "❌ ERROR: DB_PASSWORD not set"; exit 1; fi
        if [ -z "$DB_NAME" ]; then echo "❌ ERROR: DB_NAME not set"; exit 1; fi

        echo "✅ DB_HOST is set to: $DB_HOST"
        echo "✅ DB_USER is configured"
        echo "✅ DB_PASSWORD is configured"
        echo "✅ DB_NAME is set to: $DB_NAME"

        echo ""
        echo "Checking LLM API keys (at least one required for multi-provider fallback)..."
        if [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$COHERE_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
          echo "❌ ERROR: At least one LLM API key must be set"
          echo "   Set one of: GROQ_API_KEY, GEMINI_API_KEY, COHERE_API_KEY, OPENAI_API_KEY"
          exit 1
        fi

        [ -n "$GROQ_API_KEY" ] && echo "✅ GROQ_API_KEY is set"
        [ -n "$GEMINI_API_KEY" ] && echo "✅ GEMINI_API_KEY is set"
        [ -n "$COHERE_API_KEY" ] && echo "✅ COHERE_API_KEY is set"
        [ -n "$OPENAI_API_KEY" ] && echo "✅ OPENAI_API_KEY is set"

        echo ""
        echo "Checking LLM Model Configuration..."
        if [ -z "$GROQ_MODEL" ]; then echo "ERROR: GROQ_MODEL not set"; exit 1; fi
        if [ -z "$GEMINI_MODEL" ]; then echo "ERROR: GEMINI_MODEL not set"; exit 1; fi
        if [ -z "$COHERE_MODEL" ]; then echo "ERROR: COHERE_MODEL not set"; exit 1; fi
        if [ -z "$OPENAI_MODEL" ]; then echo "ERROR: OPENAI_MODEL not set"; exit 1; fi

        echo "✅ GROQ_MODEL is set to: $GROQ_MODEL"
        echo "✅ GEMINI_MODEL is set to: $GEMINI_MODEL"
        echo "✅ COHERE_MODEL is set to: $COHERE_MODEL"
        echo "✅ OPENAI_MODEL is set to: $OPENAI_MODEL"

        echo ""
        echo "Checking WordPress Publishing Configuration..."
        if [ -z "$WORDPRESS_PASSWORD" ]; then
          echo "⚠️  WARNING: WORDPRESS_PASSWORD is not set - R31 will NOT publish posts to WordPress"
          echo "         To enable publishing, set WORDPRESS_PASSWORD in GitHub Secrets"
        else
          echo "✅ WORDPRESS_PASSWORD is set"
          echo "✅ WORDPRESS_URL is set to: $WORDPRESS_URL"
          echo "✅ WORDPRESS_USER is set to: $WORDPRESS_USER"
        fi

        echo ""
        echo "======================================================================"
        echo "✅ All critical environment variables are configured correctly!"
        echo "======================================================================"
    
    - name: Install dependencies
      run: |
        apt-get update && apt-get install -y mysql-client dnsutils
        python -m pip install --upgrade pip
        pip install groq google-generativeai cohere openai mysql-connector-python requests reportlab pillow
      continue-on-error: true

    - name: Diagnostic - Test database connectivity
      run: |
        echo "====== DATABASE CONNECTIVITY DIAGNOSTIC ======"
        echo "DB_HOST: $DB_HOST"
        echo "DB_USER: $DB_USER"
        echo "DB_NAME: $DB_NAME"
        echo ""

        # Extract hostname and port
        HOST_ONLY=$(echo "$DB_HOST" | cut -d: -f1)
        PORT=$(echo "$DB_HOST" | cut -d: -f2)
        if [ -z "$PORT" ] || [ "$PORT" = "$HOST_ONLY" ]; then
          PORT=3306
        fi

        echo "Extracted: HOST=$HOST_ONLY PORT=$PORT"
        echo ""

        # Test DNS resolution
        echo "Testing DNS resolution for $HOST_ONLY..."
        nslookup "$HOST_ONLY" || echo "⚠️  DNS lookup failed"
        echo ""

        # Test TCP connection
        echo "Testing TCP connection to $DB_HOST..."
        nc -zv "$HOST_ONLY" "$PORT" 2>&1 || echo "⚠️  TCP connection failed"
        echo ""

        # Test MySQL connection with verbose error
        echo "Testing MySQL connection with credentials..."
        mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" -e "SELECT 1;" 2>&1 || echo "⚠️  MySQL connection failed - see error above"
      continue-on-error: true

    - name: Wait for MySQL and initialize database
      run: |
        echo "======================================================================"
        echo "CONNECTING TO DATABASE"
        echo "======================================================================"
        echo "DB_HOST=$DB_HOST"
        echo "DB_USER=$DB_USER"
        echo "DB_NAME=$DB_NAME"
        echo ""

        # First attempt with detailed error output
        echo "Attempt 1: Testing database connection..."
        if mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" -e "SELECT 1" 2>&1; then
          echo "✅ Database connection SUCCESSFUL!"
          CONNECTION_SUCCESS=true
        else
          echo "❌ INITIAL CONNECTION FAILED"
          echo ""
          echo "This usually means one of:"
          echo "  1. DB_HOST is incorrect or unreachable"
          echo "  2. DB_USER or DB_PASSWORD is wrong"
          echo "  3. The database server is offline"
          echo "  4. Firewall is blocking the connection"
          echo ""
          echo "Attempting to diagnose..."

          # Try to get more info
          HOST_ONLY=$(echo "$DB_HOST" | cut -d: -f1)
          echo "Testing connectivity to $HOST_ONLY:3306..."
          nc -zv "$HOST_ONLY" 3306 2>&1 || echo "Cannot reach database server"

          CONNECTION_SUCCESS=false

          # Try a few more times if first attempt failed
          for i in {2..5}; do
            echo ""
            echo "Attempt $i/5 (waiting 3 seconds)..."
            sleep 3
            if mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" -e "SELECT 1" 2>&1; then
              echo "✅ Database connection SUCCESSFUL on attempt $i!"
              CONNECTION_SUCCESS=true
              break
            fi
          done
        fi

        if [ "$CONNECTION_SUCCESS" = false ]; then
          echo ""
          echo "======================================================================"
          echo "❌ CRITICAL: DATABASE CONNECTION FAILED"
          echo "======================================================================"
          echo ""
          echo "After 5 attempts, could not connect to: $DB_HOST"
          echo ""
          echo "SOLUTION: Check your GitHub Secrets"
          echo "  1. Go to: github.com/Skybee2027/ghgf-complete/settings/secrets/actions"
          echo "  2. Verify DB_HOST is set to your actual database hostname"
          echo "     (NOT 'localhost' - GitHub Actions cannot access localhost)"
          echo "  3. Verify DB_USER and DB_PASSWORD are correct"
          echo "  4. If database is on cPanel, ask hosting provider for the"
          echo "     remote database hostname/IP"
          echo ""
          exit 1
        fi

        echo ""
        echo "======================================================================"
        echo "INITIALIZING DATABASE"
        echo "======================================================================"

        echo "Creating database and loading schema..."
        mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS $DB_NAME;"

        echo "Loading core schemas for R2-R3-R31 pipeline..."
        if [ -f database/R0_Base_Schema.sql ]; then
          if mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < database/R0_Base_Schema.sql 2>&1; then
            echo "✓ Loaded R0_Base_Schema.sql"
          else
            echo "❌ ERROR loading R0_Base_Schema.sql"
            exit 1
          fi
        fi

        if [ -f database/R0_Migration_AddColumns.sql ]; then
          if mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < database/R0_Migration_AddColumns.sql 2>&1; then
            echo "✓ Loaded R0_Migration_AddColumns.sql"
          else
            echo "❌ ERROR loading R0_Migration_AddColumns.sql"
            exit 1
          fi
        fi

        if [ -f database/R0_Migration_R2_RequiredColumns.sql ]; then
          if mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < database/R0_Migration_R2_RequiredColumns.sql 2>&1; then
            echo "✓ Loaded R0_Migration_R2_RequiredColumns.sql"
          else
            echo "❌ ERROR loading R0_Migration_R2_RequiredColumns.sql"
            exit 1
          fi
        fi

        if [ -f database/R0_Migration_MissingColumns.sql ]; then
          if mysql -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < database/R0_Migration_MissingColumns.sql 2>&1; then
            echo "✓ Loaded R0_Migration_MissingColumns.sql"
          else
            echo "❌ ERROR loading R0_Migration_MissingColumns.sql"
            exit 1
          fi
        fi

        echo "✅ Core schemas loaded successfully."
        echo "Database is now ready with all required tables and data for R2-R3-R31 pipeline."
        echo "Note: R37 and R14b schemas can be loaded later for monetization features."
    
    # PHASE: FULL PIPELINE RESUMED
    # Re-enabled R1-R31 after critical token fix (max_tokens 500->4000)
    # Now generating full-length posts with complete content

    - name: Run GHGF Pipeline - Generate & Retrofit & Publish Posts
      run: python run_full_pipeline.py 2>&1 | tee pipeline_output.log
      working-directory: ./
      continue-on-error: true

    - name: Explicit Publish - NEW Generated Blog Posts to WordPress
      run: |
        python3 << 'PYEOF'
        import os
        import mysql.connector
        import subprocess

        db_config = {
            'host': os.getenv('DB_HOST'),
            'user': os.getenv('DB_USER'),
            'password': os.getenv('DB_PASSWORD'),
            'database': os.getenv('DB_NAME')
        }

        try:
            conn = mysql.connector.connect(**db_config)
            cursor = conn.cursor(dictionary=True)

            # Find newly generated posts that haven't been published
            cursor.execute("""
                SELECT COUNT(*) as count FROM blog_posts
                WHERE status IN ('draft', 'pending', 'new')
                AND post_date = CURDATE()
            """)
            new_posts = cursor.fetchone()['count']

            print(f"\n{'='*70}")
            print(f"NEWLY GENERATED POSTS FOUND: {new_posts}")
            print(f"{'='*70}")

            if new_posts > 0:
                print(f"\n✅ Found {new_posts} new posts to publish")
                print("Running R31 WordPress Publisher now...")

                # Run R31 to publish new posts
                result = subprocess.run(
                    ['python', 'robots/r31_wordpress_uploader_publisher.py'],
                    capture_output=True,
                    text=True,
                    timeout=300
                )

                if result.returncode == 0:
                    print("✅ R31 Successfully published new posts to WordPress!")
                    if result.stdout:
                        print("\nPublish Summary:")
                        for line in result.stdout.split('\n')[-10:]:
                            if line.strip():
                                print(f"  {line}")
                else:
                    print("⚠️  R31 encountered issues:")
                    if result.stderr:
                        print(result.stderr[-500:])
            else:
                print("ℹ️  No new posts found to publish")

            cursor.close()
            conn.close()
        except Exception as e:
            print(f"⚠️  Could not verify new posts: {str(e)}")
        PYEOF
      continue-on-error: true

    - name: Run R37 - SUPER ADVANCED Content Retrofit Engine (Batch Processing FOCUSED)
      run: python robots/r37_content_retrofit_engine.py 2>&1 | tee r37_output.log
      working-directory: ./
      continue-on-error: true

    - name: Run R31 - WordPress Publisher (Publishing retrofitted posts)
      run: python robots/r31_wordpress_uploader_publisher.py 2>&1 | tee r31_output.log
      working-directory: ./
      continue-on-error: true

    - name: Verify R37 Retrofit Progress
      run: |
        python3 << 'PYEOF'
        import os
        import mysql.connector

        db_config = {
            'host': os.getenv('DB_HOST'),
            'user': os.getenv('DB_USER'),
            'password': os.getenv('DB_PASSWORD'),
            'database': os.getenv('DB_NAME')
        }

        try:
            conn = mysql.connector.connect(**db_config)
            cursor = conn.cursor(dictionary=True)

            # Check R37 retrofit progress
            cursor.execute("""
                SELECT COUNT(*) as total_posts FROM blog_posts WHERE status = 'published'
            """)
            total = cursor.fetchone()['total_posts']

            cursor.execute("""
                SELECT COUNT(*) as retrofitted FROM retrofit_log WHERE status = 'completed'
            """)
            retrofitted = cursor.fetchone()['retrofitted']

            print("\n" + "="*70)
            print("R37 RETROFIT PROGRESS")
            print("="*70)
            print(f"Total Posts in Database: {total}")
            print(f"Posts Retrofitted: {retrofitted}")
            print(f"Remaining: {total - retrofitted}")
            print(f"Progress: {round((retrofitted/total*100) if total > 0 else 0, 1)}%")
            print("="*70)

            cursor.close()
            conn.close()
        except Exception as e:
            print(f"⚠️  Database query skipped: {str(e)}")
        PYEOF

    - name: Upload error logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-error-logs
        path: |
          error_log_*.txt
          pipeline_output.log
          r37_output.log
        retention-days: 30
      continue-on-error: true
    
    - name: Workflow status
      if: always()
      run: |
        echo "Workflow completed"
        echo "Check the logs above for any robot failures"
