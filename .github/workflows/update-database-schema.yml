name: Update Database Schema

on:
  workflow_dispatch:
  workflow_call:

jobs:
  update-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python

      - name: Validate configuration
        run: |
          if [ -z "$DB_HOST" ]; then
            echo "❌ ERROR: DB_HOST not configured"
            exit 1
          fi
          if [ -z "$DB_USER" ]; then
            echo "❌ ERROR: DB_USER not configured"
            exit 1
          fi
          if [ -z "$DB_NAME" ]; then
            echo "❌ ERROR: DB_NAME not configured"
            exit 1
          fi
          echo "✓ Configuration validated"

      - name: Update Database Schema
        run: |
          echo ""
          echo "🔄 Starting Database Schema Update"
          echo "=================================================="
          python3 scripts/fix_database_schema.py

      - name: Create Summary
        if: always()
        run: |
          echo "## ✅ Database Schema Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Database schema has been updated with required columns:" >> $GITHUB_STEP_SUMMARY
          echo "- updated_at: DATETIME with auto-update" >> $GITHUB_STEP_SUMMARY
          echo "- created_at: DATETIME creation timestamp" >> $GITHUB_STEP_SUMMARY
          echo "- status: ENUM for post status" >> $GITHUB_STEP_SUMMARY
          echo "- featured_image_url: VARCHAR for image URLs" >> $GITHUB_STEP_SUMMARY
          echo "- meta_description: TEXT for SEO" >> $GITHUB_STEP_SUMMARY
          echo "- wordpress_post_id: BIGINT for WordPress sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The rework_automation_log table has been created for logging." >> $GITHUB_STEP_SUMMARY

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Database schema update failed"
          echo "Please review the logs above"
          exit 1
