name: Test API Credentials

on:
  workflow_dispatch:  # Manual trigger only

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  COHERE_MODEL: ${{ secrets.COHERE_MODEL }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

jobs:
  test-apis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install groq google-generativeai cohere openai

    - name: Run API Credential Tests
      run: python test_api_credentials.py
