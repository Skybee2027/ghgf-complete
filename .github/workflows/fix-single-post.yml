name: Fix Single Post - Phase 3 Perfect Template

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      post_title:
        description: 'Post title to fix'
        required: false
        default: '5 Complete Steps to Achieve Your Health and Fitness Dreams'

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_NAME: ${{ secrets.DB_NAME }}

jobs:
  fix-post:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install groq mysql-connector-python requests

    - name: Fix Single Post with Groq (Working Provider)
      run: |
        python3 << 'PYEOF'
        import os
        import mysql.connector
        import re
        from groq import Groq
        import sys

        POST_TITLE = "5 Complete Steps to Achieve Your Health and Fitness Dreams"
        TARGET_WORDS = 1500

        print("=" * 80)
        print("PHASE 3: SINGLE POST PERFECT FIX")
        print("=" * 80)
        print(f"\n📝 Fixing: {POST_TITLE}")
        print(f"🎯 Target: {TARGET_WORDS}+ words\n")

        # Step 1: Connect to database and get post
        print("Step 1: Connecting to database...")
        try:
            db_config = {
                'host': os.getenv('DB_HOST'),
                'user': os.getenv('DB_USER'),
                'password': os.getenv('DB_PASSWORD'),
                'database': os.getenv('DB_NAME')
            }
            conn = mysql.connector.connect(**db_config)
            cursor = conn.cursor(dictionary=True)
            print("✅ Database connected\n")

            # Get current post
            print("Step 2: Finding post in database...")
            cursor.execute(
                "SELECT id, title, content FROM blog_posts WHERE title = %s LIMIT 1",
                (POST_TITLE,)
            )
            post = cursor.fetchone()

            if not post:
                print(f"❌ Post not found: {POST_TITLE}")
                sys.exit(1)

            post_id = post['id']
            current_content = post['content']
            current_words = len(current_content.split())

            print(f"✅ Found Post ID: {post_id}")
            print(f"   Current: {current_words} words")
            print(f"   Target: {TARGET_WORDS}+ words\n")

        except Exception as e:
            print(f"❌ Database error: {str(e)}")
            sys.exit(1)

        # Step 2: Enhance with Groq
        print("Step 3: Enhancing with Groq...")
        groq_api_key = os.getenv('GROQ_API_KEY', '').strip()
        groq_model = os.getenv('GROQ_MODEL', 'openai/gpt-oss-120b').strip()

        if not groq_api_key:
            print("❌ GROQ_API_KEY not configured")
            sys.exit(1)

        try:
            client = Groq(api_key=groq_api_key)

            enhancement_prompt = f"""You are an expert health and fitness content writer. Expand this blog post to {TARGET_WORDS}+ professional, engaging words.

CURRENT CONTENT:
{current_content}

REQUIREMENTS:
1. Expand to {TARGET_WORDS}+ words minimum
2. Complete ALL promised sections (5 steps in this case)
3. Add practical examples and case studies
4. Include expert tips sections
5. Clear H2 headers
6. Short paragraphs (2-3 sentences)
7. Professional, conversational tone
8. NO markdown artifacts (no ```, backticks, code fences)
9. Strong conclusion with action items

Write COMPLETE, publication-ready content."""

            response = client.chat.completions.create(
                model=groq_model,
                messages=[{
                    "role": "user",
                    "content": enhancement_prompt
                }],
                max_tokens=4000,
                temperature=0.7
            )

            enhanced_content = response.choices[0].message.content

            # Clean artifacts
            enhanced_content = re.sub(r'```html\s*', '', enhanced_content)
            enhanced_content = re.sub(r'```\s*', '', enhanced_content)
            enhanced_content = enhanced_content.replace('"`html', '')
            enhanced_content = enhanced_content.replace('"`', '')

            new_words = len(enhanced_content.split())
            improvement = ((new_words - current_words) / current_words * 100) if current_words > 0 else 0

            print(f"✅ Enhancement complete")
            print(f"   Old: {current_words} words → New: {new_words} words")
            print(f"   Improvement: +{improvement:.0f}%\n")

        except Exception as e:
            print(f"❌ Groq error: {str(e)}")
            sys.exit(1)

        # Step 3: Update database
        print("Step 4: Updating database...")
        try:
            cursor.execute(
                """UPDATE blog_posts
                   SET content = %s, ready_for_wordpress = 1
                   WHERE id = %s""",
                (enhanced_content, post_id)
            )
            conn.commit()
            print(f"✅ Database updated\n")

        except Exception as e:
            print(f"❌ Update error: {str(e)}")
            sys.exit(1)
        finally:
            cursor.close()
            conn.close()

        # Summary
        print("=" * 80)
        print("✅ POST 1 ENHANCED AND READY")
        print("=" * 80)
        print(f"\nPost: {POST_TITLE}")
        print(f"ID: {post_id}")
        print(f"Word Count: {new_words} words")
        print(f"Quality: Professional, zero artifacts ✅")
        print(f"Status: Ready for WordPress review")
        print(f"\nNEXT: Review on WordPress, then approve for batch processing of 5/day")

        PYEOF

    - name: Publish to WordPress
      run: |
        python3 robots/r31_wordpress_uploader_publisher.py 2>&1 | tee r31_publish.log
      continue-on-error: true

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fix-post-logs
        path: |
          r31_publish.log
        retention-days: 7
      continue-on-error: true
