name: Fix Post Quality - Phase 2

on:
  workflow_dispatch:

jobs:
  fix-phase-2:
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install mysql-connector-python --break-system-packages

      - name: Run Phase 2 Fixes
        run: |
          echo ""
          echo "========================================"
          echo "PHASE 2 - POST QUALITY FIX"
          echo "========================================"
          echo ""
          echo "Database: *** / ***"
          echo "Running fix script..."
          echo ""
          python3 scripts/fix_post_quality_phase2.py

      - name: Completion Summary
        run: |
          echo ""
          echo "========================================"
          echo "✅ PHASE 2 COMPLETE"
          echo "========================================"
          echo ""
          echo "Next Steps:"
          echo "1. Visit your post on the website"
          echo "2. Verify FAQ section is complete"
          echo "3. Verify eBook link is present"
          echo "4. Verify sources are cited"
          echo "5. Run Phase 3 when ready"
          echo ""
